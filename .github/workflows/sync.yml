name: Sync films (TMDB + IMDb)

on:
  schedule:
    - cron: "7,27,47 * * * *"   # كل 20 دقيقة (GitHub بيأخّر أو بيفوّت بعض المواعيد)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-films
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch films
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node sync.mjs
      - name: Commit if changed
        run: |
          git add data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "sahra-bot"
            git config user.email "sahra-bot@users.noreply.github.com"
            git commit -m "Update films $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
