name: Sync films (Wikidata + Wikipedia)

on:
  schedule:
    - cron: "17 */6 * * *"   # كل 6 ساعات
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: sync-films
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build film list
        env:
          SEED_FILE: data/films.json
          OUT_DIR: data
        run: cp data/films.json /tmp/seed.json && SEED_FILE=/tmp/seed.json node scripts/free-films.mjs
      - name: Box office (Wikipedia)
        run: node scripts/boxoffice.mjs || echo "box office failed, keeping old"
      - name: Commit if changed
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "sahra-bot"
            git config user.email "sahra-bot@users.noreply.github.com"
            git commit -m "Update films $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q origin main || true
            git push
          fi
